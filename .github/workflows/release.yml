name: Release

# Builds the Windows installer and publishes a GitHub Release whenever a
# version tag is pushed (e.g. git tag v1.1.0 && git push origin v1.1.0).
# The released installer is what electron-updater downloads for auto-updates.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
